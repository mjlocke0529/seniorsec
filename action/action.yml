name: SeniorSec check
description: Refresh the SeniorSec profile and run the security check against this repository.
inputs:
  working-directory:
    description: Project root that holds seniorsec.json
    default: "."
  fail-on:
    description: "When to fail the job: kev (only exploited vulnerabilities), any (any finding), never"
    default: kev
outputs:
  exit-code:
    description: "0 clean, 1 findings, 2 a finding is on CISA KEV, 3 a check could not run"
    value: ${{ steps.check.outputs.code }}
runs:
  using: composite
  steps:
    - id: check
      shell: bash
      working-directory: ${{ inputs.working-directory }}
      env:
        FAIL_ON: ${{ inputs.fail-on }}
      run: |
        set +e
        node "$GITHUB_ACTION_PATH/../cli/seniorsec.mjs" check . --out seniorsec-report.md
        code=$?
        echo "code=$code" >> "$GITHUB_OUTPUT"
        cat seniorsec-report.md >> "$GITHUB_STEP_SUMMARY"
        if [ "$code" = "64" ]; then exit 1; fi
        if [ "$FAIL_ON" = "kev" ] && [ "$code" = "2" ]; then exit 1; fi
        if [ "$FAIL_ON" = "any" ] && [ "$code" != "0" ]; then exit 1; fi
        exit 0
