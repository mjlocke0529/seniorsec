# Copy to .github/workflows/seniorsec.yml in your project.
# Before relying on it, replace @main with a full commit SHA of seniorsec (rule CORE-06).
name: SeniorSec

on:
  schedule:
    - cron: "17 14 * * 1"   # Mondays
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: mjlocke0529/seniorsec/action@main
        with:
          fail-on: kev
